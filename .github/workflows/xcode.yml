name: Xcode

on:
  push:
  pull_request:
    branches: [main]

jobs:
  ios:
    name: "Xcode ${{ matrix.env.xcode }}, ${{ matrix.env.runtime }}, ${{ matrix.env.device }}"
    runs-on: macOS-14
    strategy:
      matrix:
        env:
          - xcode: 16.1
            runtime: "iOS 17.5"
            device: "iPhone 15 Pro Max"
          - xcode: 16.1
            runtime: "iOS 16.4"
            device: "iPhone 8"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: "Select Xcode ${{ matrix.env.xcode }}"
        uses: ./.github/actions/xcode-select
        with:
          version: ${{ matrix.env.xcode }}
      - name: "Cache downloaded simulator runtimes"
        uses: actions/cache@v4
        with:
          path: ~/Downloads/*.dmg
          key: Xcode ${{ matrix.env.xcode }}+${{ matrix.env.runtime }}
      - name: "Prepare simulator"
        id: prepare-simulator
        uses: ./.github/actions/prepare-simulator
        with:
          runtime: ${{ matrix.env.runtime }}
          device: ${{ matrix.env.device }}
      - name: "Build and test"
        run: |
          set -o pipefail
          xcodebuild test -scheme "Identifier" -destination "id=${{ steps.prepare-simulator.outputs.destination-id }}" | xcpretty -c
      - uses: sersoft-gmbh/swift-coverage-action@v4
        with:
          target-name-filter: ^Identifier$
      - uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

  watchos:
    name: "Xcode ${{ matrix.env.xcode }}, ${{ matrix.env.runtime }}, ${{ matrix.env.device }}"
    runs-on: macOS-14
    strategy:
      matrix:
        env:
          - xcode: 16.1
            runtime: "watchOS 10.5"
            device: "Apple Watch Ultra 2 (49mm)"
          - xcode: 16.1
            runtime: "watchOS 9.4"
            device: "Apple Watch Series 4 (40mm)"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: "Select Xcode ${{ matrix.env.xcode }}"
        uses: ./.github/actions/xcode-select
        with:
          version: ${{ matrix.env.xcode }}
      - name: "Cache downloaded simulator runtimes"
        uses: actions/cache@v4
        with:
          path: ~/Downloads/*.dmg
          key: Xcode ${{ matrix.env.xcode }}+${{ matrix.env.runtime }}
      - name: "Prepare simulator"
        id: prepare-simulator
        uses: ./.github/actions/prepare-simulator
        with:
          runtime: ${{ matrix.env.runtime }}
          device: ${{ matrix.env.device }}
      - name: "Build"
        run: |
          set -o pipefail
          xcodebuild build -scheme "Identifier" -destination "id=${{ steps.prepare-simulator.outputs.destination-id }}" | xcpretty -c
